name: 할 일
description: 팀에서 해야 할 작업을 작은 단위로 등록합니다.
title: "[Task] "
labels: ["task"]
body:
  - type: textarea
    id: objective
    attributes:
      label: 작업 목적
      description: 무엇을 왜 해야 하는지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 확인 가능한 완료 기준을 적어 주세요.
      placeholder: |
        - [ ] 구현 또는 조사 완료
        - [ ] 실행·확인 방법 작성
        - [ ] 팀원 한 명 검토
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: 담당자

  - type: input
    id: due
    attributes:
      label: 목표 날짜
      placeholder: YYYY-MM-DD

  - type: textarea
    id: dependency
    attributes:
      label: 필요한 도움 또는 선행 작업
